name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: Windows ARM64
            os: windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-ncurses

      - name: Build on Ubuntu
        if: runner.os == 'Linux'
        run: make

      - name: Test on Ubuntu
        if: runner.os == 'Linux'
        run: make test

      - name: Build on Windows ARM64
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make CC=clang AR=llvm-ar RANLIB=llvm-ranlib

      - name: Test on Windows ARM64
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test CC=clang AR=llvm-ar RANLIB=llvm-ranlib
